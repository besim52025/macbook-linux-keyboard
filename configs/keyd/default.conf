# keyd configuration template
# Docs: https://github.com/rvaiya/keyd
#
# On Debian the binary is keyd.rvaiya; the systemd service is still `keyd`.
#
# Tested on: MacBook Air M4 (UTM VM) and MacBook 9,1 (12-inch, 2016, native
# Debian), Turkish Q — key names verified there, config parses on both.
# NOT universal — verify on your machine with `sudo evtest` (same
# KEY_GRAVE/KEY_102ND codes confirmed on the 9,1 as on the M4, 16 Nov 2026).
#
# Identify key names:
#   sudo evtest                        # -> KEY_* names
#   keyd.rvaiya list-keys | less       # -> keyd names
#
# Apply:
#   sudo keyd.rvaiya reload
#
# Emergency exit (if input breaks):
#   Backspace + Escape + Enter

[ids]
*

[main]
grave = 102nd
102nd = grave
